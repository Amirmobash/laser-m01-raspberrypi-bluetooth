[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laser-m01-raspberrypi-bluetooth"
version = "1.0.0"
description = "Raspberry Pi UART driver and Bluetooth RFCOMM bridge for the M01 6-pin laser rangefinder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Amir Mobasheraghdam" },
]
keywords = [
  "M01 laser",
  "laser rangefinder",
  "laser distance sensor",
  "Raspberry Pi",
  "UART",
  "Bluetooth RFCOMM",
  "BlueZ",
  "Python",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
  "pyserial>=3.5,<4",
]

[project.optional-dependencies]
gpio = ["gpiozero>=2,<3"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
m01 = "m01_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/Amirmobash/laser-m01-raspberrypi-bluetooth"
Issues = "https://github.com/Amirmobash/laser-m01-raspberrypi-bluetooth/issues"
Source = "https://github.com/Amirmobash/laser-m01-raspberrypi-bluetooth"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
